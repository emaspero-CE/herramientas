<style>
  :root{
    --bg:#1a1410; --panel:#2a2118; --wood:#6b4423; --accent:#c9a86a;
    --text:#f0e6d6; --muted:#a89a85; --row:#241b13; --row-alt:#2d2216;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Georgia',serif; background:var(--bg); color:var(--text);
    padding:24px 16px 60px;
  }
  h1{
    text-align:center; font-size:1.6em; margin:0 0 4px; color:var(--accent);
    letter-spacing:1px;
  }
  .subtitle{ text-align:center; color:var(--muted); margin-bottom:24px; font-size:0.9em;}
  .search-wrap{
    max-width:600px; margin:0 auto 8px; display:flex; gap:8px;
  }
  .cajones-wrap{
    max-width:600px; margin:0 auto 14px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
  }
  .btn-cajon{
    padding:8px 16px; border-radius:20px; border:2px solid var(--wood); background:var(--panel);
    color:var(--text); font-family:'Georgia',serif; font-size:0.95em; cursor:pointer;
  }
  .btn-cajon:hover{ border-color:var(--accent); }
  .btn-cajon.activo{ background:var(--wood); border-color:var(--accent); color:var(--text); font-weight:bold; }
  #buscador{
    flex:1; padding:14px 16px; font-size:1.1em; border-radius:8px;
    border:2px solid var(--wood); background:var(--panel); color:var(--text);
    outline:none;
  }
  #buscador:focus{ border-color:var(--accent); }
  .stats{ max-width:600px; margin:0 auto 20px; text-align:center; color:var(--muted); font-size:0.85em;}
  .resultados{ max-width:900px; margin:0 auto; }
  .card{
    background:var(--panel); border-left:4px solid var(--accent); border-radius:6px;
    padding:14px 18px; margin-bottom:10px; display:flex; justify-content:space-between;
    align-items:center; gap:12px; flex-wrap:wrap;
  }
  .card .info{ flex:1; min-width:200px; }
  .card .artista{ font-weight:bold; font-size:1.1em; color:var(--accent); }
  .card .album{ color:var(--text); font-style:italic; }
  .card .anio{ color:var(--muted); font-size:0.9em; }
  .ubicacion{
    background:var(--wood); color:var(--text); padding:8px 14px; border-radius:6px;
    font-weight:bold; text-align:center; white-space:nowrap; font-size:0.95em;
  }
  .ubicacion.sin-ubicar{ background:#5a2a1a; color:#f0c9a8; }
  .no-results{ text-align:center; color:var(--muted); margin-top:40px; font-size:1.1em;}
  .empty-state{ text-align:center; color:var(--muted); margin-top:40px; }
</style>

    "album": "Echoes",
    "anio": 1993,
    "cajon": "Estante 1",
    "fila": null,
    "posicion": null,
    "estado": "Ubicado"
  },
  {
    "artista": "Pink Floyd",
    "album": "Pulse",
    "anio": 1995,
    "cajon": "Estante 1",
    "fila": null,
    "posicion": null,
    "estado": "Ubicado"
  },
  {
    "artista": "Elton John",
    "album": "To Be Continued...",
    "anio": 1990,
    "cajon": "Estante 1",
    "fila": null,
    "posicion": null,
    "estado": "Ubicado"
  }
];

</script>
<script>
  const input = document.getElementById('buscador');
  const resultadosDiv = document.getElementById('resultados');
  const statsDiv = document.getElementById('stats');
  const cajonesWrap = document.getElementById('cajonesWrap');
  let cajonActivo = 'todos';

  function normalizar(s){
    return s.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,''); // saca acentos
  }

  function ubicacionTexto(cd){
    if(!cd.cajon){
      return 'Sin ubicar';
    }
    if(!cd.fila || !cd.posicion){
      return String(cd.cajon); // ej: "Estante 1" (ediciones especiales sin columna/posición)
    }
    return `Cajón ${cd.cajon} · Columna ${cd.fila} · Pos. ${cd.posicion}`;
  }

  function render(lista){
    resultadosDiv.innerHTML = '';
    if(lista.length === 0){
      resultadosDiv.innerHTML = '<div class="no-results">No se encontraron CDs con ese criterio.</div>';
      return;
    }
    if(cajonActivo !== 'todos'){
      lista.sort((a,b)=> (a.fila||99) - (b.fila||99) || (parseInt(a.posicion)||99) - (parseInt(b.posicion)||99));
    } else {
      lista.sort((a,b)=>
        (parseInt(a.cajon)||99) - (parseInt(b.cajon)||99) ||
        (a.fila||99) - (b.fila||99) ||
        (parseInt(a.posicion)||99) - (parseInt(b.posicion)||99)
      );
    }
    lista.forEach(cd=>{
      const sinUbicar = !cd.cajon || !cd.fila || !cd.posicion;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="info">
          <div class="artista">${cd.artista}</div>
          <div class="album">${cd.album}</div>
          <div class="anio">${cd.anio || '—'}</div>
        </div>
        <div class="ubicacion${sinUbicar ? ' sin-ubicar' : ''}">${ubicacionTexto(cd)}</div>
      `;
      resultadosDiv.appendChild(card);
    });
  }

  function actualizarStats(){
    statsDiv.textContent = `${CDS.length} CDs cargados en el archivo`;
  }

  function aplicarFiltros(){
    const q = normalizar(input.value.trim());
    let base = CDS;
    if(cajonActivo !== 'todos'){
      base = base.filter(cd => String(cd.cajon) === cajonActivo);
    }
    if(q === ''){
      if(cajonActivo === 'todos'){
        resultadosDiv.innerHTML = '<div class="empty-state">Escribí un artista o álbum, o elegí un cajón para ver todo su contenido.</div>';
        return;
      }
      render(base);
      return;
    }
    const filtrados = base.filter(cd =>
      normalizar(cd.artista).includes(q) || normalizar(cd.album).includes(q)
    );
    render(filtrados);
  }

  input.addEventListener('input', aplicarFiltros);

  cajonesWrap.addEventListener('click', (e)=>{
    const btn = e.target.closest('.btn-cajon');
    if(!btn) return;
    cajonActivo = btn.dataset.cajon;
    [...cajonesWrap.children].forEach(b => b.classList.toggle('activo', b === btn));
    aplicarFiltros();
  });

  actualizarStats();
  resultadosDiv.innerHTML = '<div class="empty-state">Escribí un artista o álbum, o elegí un cajón para ver todo su contenido.</div>';
</script>
</body>
</html>
